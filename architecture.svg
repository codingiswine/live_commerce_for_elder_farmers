<svg width="1300" height="760" viewBox="0 0 1300 760" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1300" height="760" fill="#ffffff"/>
  <text x="650" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">농담 — 전체 아키텍처</text>
  <text x="650" y="62" text-anchor="middle" font-size="13" fill="#64748b">5개 기능 그룹 — 공통 오케스트레이션 레이어 없음 (Gradio UI로 개별 실행)</text>

  <!-- Box 1: 콘텐츠 생성 (2단계 체인) -->
  <rect x="60" y="100" width="560" height="230" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="80" y="128" font-size="14.5" font-weight="700" fill="#1e40af">1·2·3. 콘텐츠 생성 도구 (3poc_web_app.py)</text>

  <rect x="90" y="150" width="200" height="50" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="190" y="180" text-anchor="middle" font-size="12.5" fill="#0f172a">입력: 상품명·무게·특징</text>

  <line x1="190" y1="200" x2="190" y2="225" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="90" y="225" width="200" height="50" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="190" y="248" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">GPT-4o</text>
  <text x="190" y="265" text-anchor="middle" font-size="11" fill="#475569">상품 설명 생성</text>

  <line x1="290" y1="250" x2="330" y2="250" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="310" y="240" text-anchor="middle" font-size="10" fill="#64748b">순차</text>

  <rect x="330" y="225" width="200" height="50" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="430" y="248" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">DALL-E 3</text>
  <text x="430" y="265" text-anchor="middle" font-size="11" fill="#475569">상품 이미지 생성</text>

  <line x1="430" y1="275" x2="430" y2="295" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="90" y="295" width="440" height="25" rx="6" fill="#dbeafe"/>
  <text x="310" y="312" text-anchor="middle" font-size="11.5" fill="#1e40af">Gradio UI 출력 (설명 + 이미지)</text>

  <!-- Box 2: 리뷰 분석 -->
  <rect x="660" y="100" width="290" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="680" y="128" font-size="13.5" font-weight="700" fill="#15803d">4. 리뷰 분석 (4review_analysis.py)</text>
  <text x="680" y="155" font-size="11.5" fill="#334155">입력: 고객 리뷰 텍스트</text>
  <text x="680" y="178" font-size="11.5" fill="#334155">GPT-4o → 감정(긍정/부정/중립) + 키워드</text>

  <!-- Box 3: 라벨 생성 -->
  <rect x="660" y="225" width="290" height="105" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="680" y="253" font-size="13.5" font-weight="700" fill="#15803d">5. 라벨 생성 (5generate_label.py)</text>
  <text x="680" y="280" font-size="11.5" fill="#334155">입력: 상품 설명</text>
  <text x="680" y="303" font-size="11.5" fill="#334155">GPT-4o → 1~2줄 홍보 문구</text>

  <!-- Box 4: FAQ -->
  <rect x="980" y="100" width="260" height="110" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="1000" y="128" font-size="13.5" font-weight="700" fill="#854d0e">6. FAQ 챗봇 (6faq_chatbot.py)</text>
  <text x="1000" y="155" font-size="11.5" fill="#334155">입력: 사전 정의 질문 버튼 클릭</text>
  <text x="1000" y="178" font-size="11.5" fill="#334155">JSON 룩업 (LLM 미사용, 규칙 기반)</text>

  <!-- Box 5: 감정분류 (KoELECTRA) -->
  <rect x="60" y="380" width="850" height="230" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="1.6"/>
  <text x="80" y="408" font-size="14.5" font-weight="700" fill="#6b21a8">감정분류 서브프로젝트 (comment.py → sentiment_classification/)</text>

  <rect x="90" y="430" width="220" height="55" rx="7" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.3"/>
  <text x="200" y="454" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Selenium 크롤링</text>
  <text x="200" y="472" text-anchor="middle" font-size="10.5" fill="#64748b">네이버 쇼핑라이브 실시간 댓글</text>

  <line x1="310" y1="457" x2="350" y2="457" stroke="#9333ea" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="350" y="430" width="230" height="55" rx="7" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.3"/>
  <text x="465" y="454" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">KoELECTRA 파인튜닝</text>
  <text x="465" y="472" text-anchor="middle" font-size="10.5" fill="#64748b">44개 감정 클래스 멀티라벨</text>

  <line x1="580" y1="457" x2="610" y2="457" stroke="#9333ea" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="610" y="425" width="280" height="65" rx="7" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.3"/>
  <text x="750" y="448" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">동일기준 F1 0.0166 → 0.2196 (약 13배)</text>
  <text x="750" y="465" text-anchor="middle" font-size="10" fill="#64748b">학습 중 최고 validation F1: 0.6105 (Epoch 8)</text>
  <text x="750" y="480" text-anchor="middle" font-size="9.5" fill="#9333ea">※ 서로 다른 평가 기준, 직접 비교 불가</text>

  <rect x="90" y="510" width="790" height="70" rx="7" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.3"/>
  <text x="110" y="535" font-size="12" fill="#334155">별도: LangChain 프롬프트 기반 감정 분석(1analyze-sentiment.py) — 긍정/부정/중립 + 유형 + 요약</text>
  <text x="110" y="558" font-size="11" fill="#7e22ce" font-weight="600">※ Selenium 크롤링과 KoELECTRA/LangChain 분석은 별도 스크립트로 실행, 자동 연결 없음</text>

  <!-- Bottom note -->
  <rect x="60" y="650" width="1180" height="70" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.3" stroke-dasharray="5,3"/>
  <text x="80" y="678" font-size="13" font-weight="700" fill="#9a3412">현재 상태 및 로드맵</text>
  <text x="80" y="700" font-size="12" fill="#7c2d12">5개 기능 그룹은 각각 독립 실행 (에이전트 루프·오케스트레이션 없음) — LangGraph 기반 멀티에이전트 라우팅 통합을 다음 단계로 설계</text>
</svg>
